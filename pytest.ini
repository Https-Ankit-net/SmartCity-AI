[pytest]
testpaths = tests
pythonpath = backend
addopts = -ra --strict-markers
markers =
    redis: tests that exercise the Redis event bus (use fakeredis, no server needed)
filterwarnings =
    ignore::DeprecationWarning:spacy.*
    ignore::DeprecationWarning:thinc.*
    ignore::DeprecationWarning:weasel.*
