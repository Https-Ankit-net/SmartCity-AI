name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # CPU wheels for torch (pulled in by ultralytics); the default CUDA build is ~2 GB larger.
  PIP_INDEX_URL: https://download.pytorch.org/whl/cpu
  PIP_EXTRA_INDEX_URL: https://pypi.org/simple

jobs:
  test:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartcity
          POSTGRES_PASSWORD: smartcity
          POSTGRES_DB: smartcity_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartcity -d smartcity_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Select database
        if: matrix.database == 'postgres'
        run: echo "TEST_DATABASE_URL=postgresql+psycopg2://smartcity:smartcity@localhost:5432/smartcity_test" >> "$GITHUB_ENV"

      - name: Run tests
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Migrations match the models
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL || 'sqlite:///./ci-migrations.db' }}
        run: |
          python -m app.db.migrate
          alembic check

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.database }}
          path: test-results.xml

  lint-config:
    name: Lint Dockerfiles, Compose and Nginx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint (backend)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
      - name: Hadolint (nginx)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: deployment/nginx/Dockerfile
      - name: Compose file is valid
        run: JWT_SECRET=ci-placeholder-secret-ci-placeholder-secret POSTGRES_PASSWORD=ci docker compose config --quiet
      - name: Nginx config is valid
        run: |
          docker run --rm --add-host backend:127.0.0.1 \
            -v "$PWD/deployment/nginx/smartcity.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

  images:
    name: Build images${{ github.event_name != 'pull_request' && ' and publish' || '' }}
    needs: [test, lint-config]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names
        id: names
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "backend=${{ env.REGISTRY }}/${repo}-backend" >> "$GITHUB_OUTPUT"
          echo "web=${{ env.REGISTRY }}/${repo}-web" >> "$GITHUB_OUTPUT"

      - name: Backend tags
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.backend }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Web tags
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.web }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build web (nginx + frontend)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/nginx/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  smoke:
    name: Compose smoke test
    needs: [test, lint-config]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        env:
          JWT_SECRET: ci-smoke-secret-ci-smoke-secret-ci-smoke
          POSTGRES_PASSWORD: ci-smoke
          HTTP_PORT: "8088"
          WEB_CONCURRENCY: "2"
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Check endpoints through nginx
        run: |
          curl -fsS http://localhost:8088/healthz
          curl -fsS http://localhost:8088/health | tee /dev/stderr | grep -q '"event_bus":"redis"'
          curl -fsS http://localhost:8088/api/departments | grep -q "Fire Services"
          curl -fsS http://localhost:8088/docs | grep -qi swagger
          curl -fsS http://localhost:8088/config.js | grep -q "apiBase: ''"
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
