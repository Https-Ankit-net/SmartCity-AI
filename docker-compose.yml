# SmartCity AI production stack: PostgreSQL + Redis + FastAPI backend + Nginx.
#
#   cp .env.example .env      # then set JWT_SECRET and POSTGRES_PASSWORD
#   docker compose up -d --build
#   open http://localhost (or http://localhost:${HTTP_PORT})
#
# Only Nginx publishes a port; the database, Redis and the API are reachable only
# inside the compose network.

name: smartcity-ai

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartcity_ai}
      POSTGRES_USER: ${POSTGRES_USER:-smartcity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    # Pub/sub fan-out of WebSocket events between backend workers; nothing to persist.
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    image: ${BACKEND_IMAGE:-smartcity-ai/backend:latest}
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-smartcity}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smartcity_ai}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      UPLOAD_DIR: /data/uploads
      # Account emails (staff approval). console = log only; smtp = really send.
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@smartcity.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-SmartCity AI}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Public address of the site, used for links in emails.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # Optional fine-tuned civic model (scripts/train_yolo.py), mounted read-only below.
      YOLO_WEIGHTS: ${YOLO_WEIGHTS:-/opt/models/yolov8n.pt}
    volumes:
      - uploads:/data/uploads
      - ./backend/app/ai/weights:/opt/models/custom:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    build:
      context: .
      dockerfile: deployment/nginx/Dockerfile
    image: ${WEB_IMAGE:-smartcity-ai/web:latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
